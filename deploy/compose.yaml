# TrellisMX GLM-5.3-Flash r27 + RP2 (September 26, 2026). Four RTX PRO 6000 Blackwell (SM120), TP4/DCP4.
# MODEL_ROOT: the pinned NVFP4 carrier directory. TRELLISMX_ROOT: the TrellisMX checkpoint directory.
# Image pinned by digest (Docker Hub, pushed 2026-09-26).
services:
  trellismx:
    image: verdictai/trellismx:glm53-flash-p8-r27-rp2-20260926@sha256:a0392e1c370eb933d87511928ea3aba6d5d63965cfe6eeaf9cc026a667e98ddc
    restart: "no"
    network_mode: host
    ipc: host
    gpus: all
    working_dir: /
    entrypoint: ["/bin/bash", "/release/serve-rp2.sh"]
    environment:
      PORT: "8000"
      SERVED_MODEL_NAME: "glm53-flash-trellismx-p8-rp2"
      MODEL_ROOT: "/model"
      VLLM_TRELLISMX_CHECKPOINT: "/checkpoint"
      TP: "4"
      DCP: "4"
      CACHE_MODE: "vram"
      SPECULATOR: "mtp"
      NUM_SPECULATIVE_TOKENS: "3"
      KV_CACHE_DTYPE: "fp8"
      B12X_P8_DOWN_REMAINDER: "rp2"
      B12X_P8_EPI_PAR: "1"
      MAX_MODEL_LEN: "1000000"
      MAX_NUM_SEQS: "48"
      MAX_NUM_BATCHED_TOKENS: "8192"
      GPU_MEMORY_UTILIZATION: "0.88"
      CP_KV_CACHE_INTERLEAVE_SIZE: "4"
      DCP_CKV_GATHER: "auto"
      NCCL_MIN_NCHANNELS: "8"
      NCCL_MAX_NCHANNELS: "8"
      VLLM_PCIE_ONESHOT_ALLREDUCE_MAX_SIZE: "131072"
      VLLM_PCIE_ONESHOT_FUSED_ADD_RMS_NORM_MAX_SIZE: "86016"
      VLLM_SHARED_EXPERTS_STREAM_TOKEN_THRESHOLD: "4096"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - ${MODEL_ROOT:?Set MODEL_ROOT to the pinned carrier directory}:/model:ro
      - ${TRELLISMX_ROOT:-.}:/checkpoint:ro
      - trellismx-rp2-jit:/cache/jit
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 30m
      retries: 10
volumes:
  trellismx-rp2-jit: {}
